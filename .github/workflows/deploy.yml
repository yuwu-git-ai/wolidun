name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/root/app"
          strip_components: 0

      - name: Rebuild and check logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 15m
          script: |
            cd /root/app
            echo "[deploy] Checking public IP..."
            PUBLIC_IP=$(curl -s --max-time 5 ifconfig.me 2>/dev/null || curl -s --max-time 5 icanhazip.com 2>/dev/null || echo "unknown")
            echo "[deploy] Server public IP: $PUBLIC_IP"
            echo "[deploy] git pull as fallback (may fail)..."
            git pull origin master 2>&1 || echo "[deploy] git pull failed, using SCP'd files"
            echo "[deploy] Building and starting..."
            docker compose down --remove-orphans 2>/dev/null || true
            docker rm -f app-app-1 2>/dev/null || true
            docker network rm app_default 2>/dev/null || true
            docker compose up -d --build 2>&1
            echo "[deploy] Waiting for server to start..."
            sleep 10
            echo "[deploy] Docker logs:"
            docker logs app-app-1 --tail 50 2>&1
            echo "[deploy] Testing container from host (localhost)..."
            curl -v --max-time 5 http://localhost:3001/api/health 2>&1 || echo "[deploy] localhost curl failed"
            echo "[deploy] Testing container from host (public IP)..."
            curl -v --max-time 5 http://124.223.177.149:3001/api/health 2>&1 || echo "[deploy] public IP curl failed"
            echo "[deploy] Checking iptables..."
            iptables -L -n 2>&1 | head -20 || echo "[deploy] iptables not available"
